[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reliability-patterns"
version = "0.1.0"
description = "Dependency-free reference patterns for reliable AI tool execution"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"

[tool.setuptools.packages.find]
include = ["reliable_agents*"]
